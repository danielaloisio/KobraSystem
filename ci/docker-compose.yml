services:
  postgres:
    image: postgres:16-alpine
    container_name: kobrasystem-postgres
    environment:
      POSTGRES_DB: kobrasystem
      POSTGRES_USER: kobra
      POSTGRES_PASSWORD: kobra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
